        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --flame-orange: #ff6b4a;
            --deep-red: #d4534d;
            --mystic-purple: #a855a8;
            --shadow-purple: #8b4789;
            --gold: #ffa500;
            --dark-gold: #d4af37;
            --bg-dark: #0a0a0a;
            --bg-darker: #050505;
            --bg-card: #1a1a1a;
            --bg-hover: #2a2a2a;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --border: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.8;
        }

        .nav-bar {
            background: var(--bg-card);
            border-bottom: 2px solid var(--flame-orange);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 1.5rem;
            color: var(--flame-orange);
        }

        .back-btn {
            background: var(--flame-orange);
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: var(--deep-red);
        }

        .header {
            text-align: center;
            padding: 3rem 2rem;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(rgba(0,0,0,0.5), rgba(10,10,10,0.9));
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--flame-orange), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 800px;
            margin: 0 auto;
        }

        .stats-bar {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .stat-box {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid var(--flame-orange);
            text-align: center;
        }

        .stat-box.purple { border-left-color: var(--mystic-purple); }
        .stat-box.gold { border-left-color: var(--gold); }
        .stat-box.red { border-left-color: var(--deep-red); }

        .stat-box .number {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--flame-orange), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-box.purple .number {
            background: linear-gradient(135deg, var(--mystic-purple), var(--shadow-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-box .label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        .controls {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--flame-orange);
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--flame-orange);
            color: white;
            border-color: var(--flame-orange);
        }

        .content-container {
            max-width: 1400px;
            margin: 0 auto 4rem;
            padding: 0 2rem;
        }

        .region-section {
            margin-bottom: 3rem;
        }

        .region-header {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--flame-orange);
            background: linear-gradient(135deg, var(--flame-orange), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .herb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .herb-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.3s;
            border-left: 4px solid var(--flame-orange);
        }

        .herb-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 107, 74, 0.2);
            border-left-color: var(--gold);
        }

        .herb-card.gift {
            border-left-color: var(--deep-red);
        }

        .herb-card.kampanj {
            border-left-color: var(--mystic-purple);
        }

        .herb-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--flame-orange);
        }

        .herb-card.gift .herb-name {
            color: var(--deep-red);
        }

        .herb-card.kampanj .herb-name {
            color: var(--mystic-purple);
        }

        .herb-tag {
            display: inline-block;
            background: var(--bg-darker);
            color: var(--gold);
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .herb-tag.gift {
            background: var(--deep-red);
            color: white;
        }

        .herb-tag.kampanj {
            background: var(--mystic-purple);
            color: white;
        }

        .herb-detail {
            margin: 0.75rem 0;
            font-size: 0.95rem;
        }

        .herb-detail strong {
            color: var(--gold);
            min-width: 100px;
            display: inline-block;
        }

        .herb-effect {
            background: var(--bg-darker);
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
            border-left: 3px solid var(--flame-orange);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .herb-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

        let currentFilter = 'all';

        function renderHerbs() {
            const container = document.getElementById('herbs-container');
            container.innerHTML = '';

            const regionTitles = {
                'slätterna': 'Stora Slätterna - Klassiska Örter',
                'tarkas': 'Tarkas - Vulkaniska Örter',
                'cermira': 'Cermira/Mithera - Nordiska Örter',
                'muhad': 'Muhad/Öken - Arabiska Örter',
                'jargien': 'Jargien - Imperiella Örter',
                'skugglandet': 'Skugglandet - Demoniska Örter',
                'hav': 'Hav/Kust - Sjöfarares Medicin',
                'skogar': 'Skogar - Europeiska Örter',
                'dvärg': 'Dvärg/Underjord - Grottväxter',
                'tirak': 'Tirak/Barbariska - Vilda Örter',
                'alv': 'Alv/Sunari - Magiska Örter'
            };

            Object.keys(herbsData).forEach(region => {
                const section = document.createElement('div');
                section.className = 'region-section';
                section.dataset.region = region;

                const header = document.createElement('h2');
                header.className = 'region-header';
                header.textContent = regionTitles[region];
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'herb-grid';

                herbsData[region].forEach(herb => {
                    const card = document.createElement('div');
                    card.className = 'herb-card';
                    card.dataset.name = herb.name.toLowerCase();
                    card.dataset.effect = herb.effect.toLowerCase();
                    card.dataset.tags = herb.tags.join(' ').toLowerCase();

                    if (herb.tags.includes('gift')) {
                        card.classList.add('gift');
                    }
                    if (herb.tags.includes('kampanj')) {
                        card.classList.add('kampanj');
                    }

                    const tags = herb.tags.map(tag => {
                        if (tag === 'gift') {
                            return '<span class="herb-tag gift">🩸 GIFT</span>';
                        } else if (tag === 'kampanj') {
                            return '<span class="herb-tag kampanj">⭐ ' + herb.tags[herb.tags.indexOf(tag) + 1] + '</span>';
                        } else if (herb.tags[herb.tags.indexOf(tag) - 1] !== 'kampanj') {
                            return '<span class="herb-tag">' + tag + '</span>';
                        }
                        return '';
                    }).filter(t => t).join('');

                    card.innerHTML = `
                        <div class="herb-name">${herb.name}</div>
                        ${tags}
                        <div class="herb-detail"><strong>📍 Växtplats:</strong> ${herb.location}</div>
                        <div class="herb-detail"><strong>💰 Pris:</strong> ${herb.price} per dos</div>
                        <div class="herb-detail"><strong>🧪 Tillredning:</strong> ${herb.preparation}</div>
                        <div class="herb-detail"><strong>🎯 Färdighet:</strong> ${herb.skill}</div>
                        <div class="herb-effect"><strong>✨ Effekt:</strong> ${herb.effect}</div>
                    `;

                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function filterRegion(region) {
            currentFilter = region;

            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            const sections = document.querySelectorAll('.region-section');
            const cards = document.querySelectorAll('.herb-card');

            if (region === 'all') {
                sections.forEach(s => s.style.display = 'block');
                cards.forEach(c => c.style.display = 'block');
            } else if (region === 'gift') {
                sections.forEach(s => s.style.display = 'block');
                cards.forEach(c => {
                    if (c.classList.contains('gift')) {
                        c.style.display = 'block';
                    } else {
                        c.style.display = 'none';
                    }
                });
            } else if (region === 'kampanj') {
                sections.forEach(s => s.style.display = 'block');
                cards.forEach(c => {
                    if (c.classList.contains('kampanj')) {
                        c.style.display = 'block';
                    } else {
                        c.style.display = 'none';
                    }
                });
            } else {
                sections.forEach(s => {
                    if (s.dataset.region === region) {
                        s.style.display = 'block';
                    } else {
                        s.style.display = 'none';
                    }
                });
            }
        }

        function filterHerbs() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const cards = document.querySelectorAll('.herb-card');

            cards.forEach(card => {
                const name = card.dataset.name;
                const effect = card.dataset.effect;
                const tags = card.dataset.tags;

                if (name.includes(searchTerm) || effect.includes(searchTerm) || tags.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Initialize on page load
        renderHerbs();
    </script>
